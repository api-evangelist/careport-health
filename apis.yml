aid: careport-health
name: Careport Health
description: >-
  CarePort Health, powered by WellSky, is a healthcare technology company
  providing care coordination and patient transition management across the
  entire care continuum. Its platform connects hospitals, health systems, ACOs,
  physician groups, payers, and post-acute providers to manage discharge
  planning, referrals, transitions of care, emergency department optimization,
  utilization and authorization management, and value-based programs. Products
  include Guide, Connect, Insight, Care Management, Transition, Referral
  Management, Intake, and Discharge, with EHR integrations for Epic and Cerner.
  CarePort reports covering 14M lives across roughly 2,000 hospitals in 43 U.S.
  states. It was added to the API Evangelist network as a portfolio lead (500
  Global, Techstars); no public developer API, developer portal, or
  documentation surface was found during enrichment.
